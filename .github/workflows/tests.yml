name: Source tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  storage-and-network:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/StorageTests -c Release
