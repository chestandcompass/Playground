name: Source tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  storage-and-network:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/StorageTests -c Release
      - run: dotnet run --project tests/TransportTests -c Release
  relay-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: relay
      - run: npm test
        working-directory: relay
